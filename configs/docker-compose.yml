version: '3.8'

# New-API 完整部署配置
# 包含：New-API + MySQL 8.0 + Redis 7
#
# 使用方法：
#   1. cp .env.example .env  # 修改密码
#   2. docker compose up -d
#

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    ports:
      - "${NEWAPI_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    environment:
      # 数据库连接（MySQL）
      - SQL_DSN=root:${MYSQL_ROOT_PASSWORD}@tcp(db:3306)/new-api

      # Redis 缓存
      - REDIS_CONN=redis://redis:6379

      # 时区
      - TZ=Asia/Shanghai

      # 安全（多机部署必填，单机可不用）
      - SESSION_SECRET=${SESSION_SECRET:-}
      - CRYPTO_SECRET=${CRYPTO_SECRET:-}

      # 关闭默认 token
      - GENERATE_DEFAULT_TOKEN=false

      # 性能优化
      - NODE_ENV=production
      - LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - newapi-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mysql:8.0
    container_name: new-api-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: new-api
      TZ: Asia/Shanghai
    volumes:
      - ./mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - newapi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: new-api-redis
    restart: always
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - ./redis:/data
    environment:
      - TZ=Asia/Shanghai
    networks:
      - newapi-network

networks:
  newapi-network:
    driver: bridge
