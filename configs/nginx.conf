# Nginx 反向代理配置
# 用途：让用户通过 HTTPS 访问 New-API
#
# 使用方法：
#   1. 替换 yourdomain.com 为你的真实域名
#   2. cp this /etc/nginx/sites-available/new-api
#   3. ln -s /etc/nginx/sites-available/new-api /etc/nginx/sites-enabled/
#   4. sudo certbot --nginx -d api.yourdomain.com
#

# 强制 HTTP → HTTPS
server {
    listen 80;
    server_name api.yourdomain.com;  # ← 替换

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;  # ← 替换

    # SSL 证书（certbot 自动配置）
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全 Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 日志
    access_log /var/log/nginx/newapi-access.log;
    error_log /var/log/nginx/newapi-error.log;

    # 文件上传大小（API 请求体）
    client_max_body_size 50M;

    # 反向代理到 New-API
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket 支持
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 缓冲优化
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 健康检查（可选）
    location /api/status {
        access_log off;
        proxy_pass http://127.0.0.1:3000/api/status;
    }
}
